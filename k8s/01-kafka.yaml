# Single-node Kafka (KRaft) for the devbox exporter test. Devbox only.
#
# Two listeners:
#   PLAINTEXT :9092  - in-cluster clients (the exporter)
#   EXTERNAL  :19092 - laptop clients through `kubectl port-forward svc/kafka 19092:19092`
apiVersion: v1
kind: Namespace
metadata:
  name: event-export
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: event-export
spec:
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
    - name: external
      port: 19092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: event-export
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # Without this, k8s injects KAFKA_PORT=tcp://... for the "kafka" Service,
      # and the image reads every KAFKA_* variable as a broker setting.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports:
            - containerPort: 9092
            - containerPort: 19092
          # "Running" only means the JVM started. The broker takes a few more
          # seconds to listen; without this probe `rollout status` returns too
          # early and the first kafka-topics.sh call logs connection warnings.
          readinessProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 2
            failureThreshold: 30
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,EXTERNAL://:19092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka.event-export.svc.cluster.local:9092,EXTERNAL://localhost:19092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
